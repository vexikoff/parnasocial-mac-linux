name: Release Build

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build and Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --win --publish always

    build-macos-x64:
        runs-on: macos-26-intel
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build and Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --mac --x64 --publish always

    build-macos-arm64:
        runs-on: macos-26
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build and Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --mac --arm64 --publish always

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build and Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder --linux --publish always