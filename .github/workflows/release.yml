name: Release Build

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      args: --win
                    - os: macos-26-intel
                      args: --mac --x64
                    - os: macos-26
                      args: --mac --arm64
                    - os: ubuntu-latest
                      args: --linux
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build and Publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx electron-builder ${{ matrix.args }} --publish always